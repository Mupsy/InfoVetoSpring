spring.application.name=API

server.port=8080

# Actuactor

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-components=always

#JWT

app.jwt.secret = votre_secret_jwt_super_securise_changez_moi_en_production
app.jwt.expiration = 86400000

# Database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url =jdbc:mariadb://localhost:3306/infoveto
spring.datasource.username=root
spring.datasource.password=root

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#API

app.api.version=v1

# Mail configuration
app.mail.from=infoveto@infoveto.fr
app.mail.smtp.enabled=false
#False = simulation for testing purpose (prints email content to logs instead of sending)

# SMTP settings (To Setup Gmail SMTP, make sure to allow less secure apps or use App Passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=infoveto@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Do not make the application fail or block on startup if SMTP is unreachable.
# Do not test SMTP connection on startup (useful in dev or when SMTP is blocked).
spring.mail.test-connection=false

# Disable mail health indicator if your environment blocks outbound SMTP.
management.health.mail.enabled=false
